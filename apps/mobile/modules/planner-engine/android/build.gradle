plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

group = 'expo.modules.plannerengine'
version = '0.1.0'

android {
  namespace "expo.modules.plannerengine"
  defaultConfig {
    versionCode 1
    versionName "0.1.0"
  }
  lintOptions {
    abortOnError false
  }
}

// The engine comes from mavenLocal, published by scripts/publish-engine-local.sh in the
// repo root (planning-core-android + planning-contract). The AAR carries the engine, the
// domain model and the contract types; the bridge only sees them through EnginePreview.
repositories {
  mavenLocal()
}

dependencies {
  implementation 'com.example:planning-core-android:0.1.0'
}