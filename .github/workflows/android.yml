name: Android verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM, lint, debug, and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.1"

      - name: Run build gates
        # --continue so one lint finding does not hide the test results.
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          testDebugUnitTest
          lintDebug
          assembleDebug
          assembleDebugAndroidTest
          lintRelease
          assembleRelease
          :app:analyzeReleaseR8Config

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-evidence
          if-no-files-found: warn
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/

  instrumentation:
    name: API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners have no API 37 emulator image yet, so the
        # emulator step fails before any test runs. 24 is minSdk and 36 is the
        # newest image the runners actually carry; API 37 is covered locally.
        api-level: [24, 36]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager "build-tools;36.0.0" "platforms;android-37.1"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumentation-evidence-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            app/build/outputs/androidTest-results/
            app/build/reports/androidTests/
