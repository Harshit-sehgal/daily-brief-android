name: Android verification

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: android-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: JVM, lint, debug, and release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Validate Gradle wrapper
        uses: gradle/actions/wrapper-validation@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.1"

      - name: Run build gates
        # --continue so one lint finding does not hide the test results.
        run: >-
          ./gradlew --no-daemon --stacktrace --continue
          :planning-core:jvmTest
          :planning-core:compileCommonMainKotlinMetadata
          :planning-contract:jvmTest
          :server:test
          testDebugUnitTest
          lintDebug
          assembleDebug
          assembleDebugAndroidTest
          lintRelease
          assembleRelease
          :app:analyzeReleaseR8Config

      - name: Upload build evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-build-evidence
          if-no-files-found: warn
          path: |
            apps/android/build/outputs/apk/
            apps/android/build/reports/
            apps/android/build/test-results/
            packages/planning-core/build/test-results/
            packages/planning-contract/build/test-results/
            services/server/build/test-results/

  mobile-release:
    name: Expo Android release
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      DAILYBRIEF_GRADLE_ONLINE: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install mobile SDK packages
        run: >-
          sdkmanager
          "build-tools;36.0.0"
          "platforms;android-36"
          "ndk;27.1.12297006"
          "cmake;3.22.1"

      - name: Install mobile dependencies
        run: npm ci --prefix apps/mobile

      - name: Run mobile JavaScript gates
        working-directory: apps/mobile
        run: |
          npm test
          npm run lint
          npx tsc --noEmit

      - name: Build and verify mobile release
        run: ./scripts/verify-mobile-release.sh

      - name: Upload mobile release evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: mobile-android-release-evidence
          if-no-files-found: warn
          path: |
            apps/mobile/android/app/build/outputs/apk/release/*.apk
            apps/mobile/android/app/build/intermediates/merged_manifests/release/processReleaseManifest/AndroidManifest.xml
            apps/mobile/android/build/reports/

  instrumentation:
    name: API ${{ matrix.api-level }} instrumentation
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        # GitHub-hosted runners have no API 37 emulator image yet, so the
        # emulator step fails before any test runs. 24 is minSdk and 36 is the
        # newest image the runners actually carry; API 37 is covered locally.
        api-level: [24, 36]

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.1"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Run connected tests
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./gradlew --no-daemon --stacktrace connectedDebugAndroidTest

      - name: Upload instrumentation evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-instrumentation-evidence-api-${{ matrix.api-level }}
          if-no-files-found: warn
          path: |
            apps/android/build/outputs/androidTest-results/
            apps/android/build/reports/androidTests/

  rendered-api24:
    name: API 24 rendered capture
    runs-on: ubuntu-latest
    timeout-minutes: 40

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install compile SDK
        run: sdkmanager "build-tools;36.0.0" "platforms;android-36" "platforms;android-37.1"

      - name: Enable KVM access
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' \
            | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Capture API 24 plates
        uses: reactivecircus/android-emulator-runner@v2
        env:
          DAILYBRIEF_GRADLE_ONLINE: 1
        with:
          api-level: 24
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          script: ./scripts/capture-preview.sh

      - name: Upload API 24 rendered evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: android-rendered-evidence-api-24
          if-no-files-found: warn
          path: |
            build/preview-plates/
            build/preview-capture.log

  server-journey:
    name: Server Docker acceptance journey
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Run the Postgres-backed journey
        run: |
          set -o pipefail
          DAILYBRIEF_GRADLE_ONLINE=1 ./scripts/journey.sh | tee server-journey.log

      - name: Upload server journey evidence
        if: always()
        uses: actions/upload-artifact@v6
        with:
          name: server-journey-evidence
          if-no-files-found: warn
          path: |
            server-journey.log
            build/journey-evidence/
